schema_version: "1.0"

extension:
  id: brand
  name: "Brand Foundation"
  version: "1.1.0"
  description: "Four-stage brand planning from spec.md: cultural anchors, name screening, slogan & full plan, finalization. Produces brand.md and a name-check report. 四阶段品牌策划：文化锚点、名称查重、Slogan 与全案、定稿固化。"
  category: "product"
  effect: "read-write"
  author: "Lei"
  repository: "https://github.com/1689393498/spec-brand-foundation"
  license: MIT

requires:
  speckit_version: ">=1.4.0"

provides:
  commands:
    - name: "speckit.brand.foundation"
      file: "commands/brand.md"
      description: "Four-stage brand planning workflow with human confirmation at every stage: cultural anchors, name screening, slogan & full plan, finalization. Produces docs/brand/brand.md and name-check.md. 四阶段品牌策划工作流，逐阶段确认。"

tags:
  - brand
  - marketing
  - strategy
  - product
  - workflow
