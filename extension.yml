schema_version: "1.0"

extension:
  id: brand
  name: "Brand"
  version: "2.1.0"
  description: "End-to-end brand workflow from the project's specs: brand.md, name screening, brand clarification, then a combined prototype and initial visual identity page. 从项目 specs 到品牌文档、查重、澄清与原型/视觉交付的完整工作流。"
  category: "product"
  effect: "read-write"
  author: "Lei"
  repository: "https://github.com/1689393498/speckit-brand-foundation"
  license: MIT

requires:
  speckit_version: ">=1.4.0"

provides:
  commands:
    - name: "speckit.brand.run"
      file: "commands/brand-run.md"
      description: "Run the full brand workflow end to end: brand.md, name screening, brand clarification, then a combined prototype and initial visual identity page. Stops at every human decision. 端到端品牌工作流，逐决策点确认。"
    - name: "speckit.brand.create"
      file: "commands/brand-create.md"
      description: "Build or rebuild docs/brand/brand.md from the project's specs: project brief, audience, positioning and anchors, naming, slogan, visual and verbal direction. 从项目 specs 生成品牌手册草稿。"
    - name: "speckit.brand.name-check"
      file: "commands/brand-name-check.md"
      description: "Screen shortlisted brand names against app stores, domains, public search, and preliminary trademark risk; results are written into brand.md. 独立名称查重，结果写入 brand.md。"
    - name: "speckit.brand.clarify"
      file: "commands/brand-clarify.md"
      description: "Ask up to five targeted questions to remove ambiguity in brand.md, then apply the answers back into the document. 品牌方向层澄清。"
    - name: "speckit.brand.prototype"
      file: "commands/brand-prototype.md"
      description: "Derive a visual board and initial logo/VI from brand.md, design the product prototype from it, and assemble one combined page for a single review. 视觉板、初版 logo/VI 与界面原型合成页。"
    - name: "speckit.brand.prototype-clarify"
      file: "commands/brand-prototype-clarify.md"
      description: "Ask up to five targeted questions about prototype behavior, states, flows, and boundaries, then apply the answers to the prototype. 原型行为与状态澄清。"

tags:
  - brand
  - naming
  - prototype
  - visual-identity
  - marketing
  - product
  - workflow
